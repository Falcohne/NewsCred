# ============================================================
# NewsCred backend config — SAFE FOR LOCAL DEV
# Real secrets come from environment variables. NEVER commit
# a version of this file containing real passwords/keys.
# ============================================================

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/newscred_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT — REQUIRED: set JWT_SECRET env var (32+ random chars)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}

# Email (optional in dev)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Paystack (Phase: premium) — use TEST keys in dev
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.plan.amount-pesewas=${PREMIUM_PRICE_PESEWAS:1500}
paystack.currency=${PAYSTACK_CURRENCY:GHS}

# Sightengine (AI-generated image detection) - optional, get a free key at
# https://sightengine.com. Degrades gracefully if unset.
sightengine.api-user=${SIGHTENGINE_API_USER:}
sightengine.api-secret=${SIGHTENGINE_API_SECRET:}

# Groq (audio transcription, Whisper Large v3) - optional, free tier, no
# credit card required. Get a key at https://console.groq.com/keys.
# Degrades gracefully if unset.
groq.api-key=${GROQ_API_KEY:}

# Google Cloud Translation API v2 (non-English article/audio support) -
# optional, get a key at https://cloud.google.com/translate. Degrades
# gracefully if unset (articles are scored in their original language).
google.translate.api-key=${GOOGLE_TRANSLATE_API_KEY:}

app.frontend.url=${FRONTEND_URL:http://localhost:19006}

# Upload size limit (image/audio analysis endpoints; each endpoint also
# enforces its own tighter per-type limit in code)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.com.NewsCred.backend=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Rate limiting
rate.limit.default.requests=${RATE_LIMIT_DEFAULT:10}
rate.limit.premium.requests=${RATE_LIMIT_PREMIUM:50}
rate.limit.window.seconds=${RATE_LIMIT_WINDOW:60}

# Cache
spring.cache.type=simple
spring.cache.cache-names=sources,factChecks,users
